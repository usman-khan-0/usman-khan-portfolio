      <stop offset="100%" stop-color="#A80B18"/>
    </linearGradient>
    <linearGradient id="acadRight" x1="32" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D11523"/>
